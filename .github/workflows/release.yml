name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # One version for everything: `version` in the workspace Cargo.toml. The
      # tag must match it, so the exe, the master's update check and the
      # release name can never disagree.
      - name: Check tag matches Cargo.toml version
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($tag -ne $cargo) {
            Write-Error "Tag v$tag does not match Cargo.toml version $cargo. Bump [workspace.package] version first."
            exit 1
          }
          "version=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          echo "FLEETVIEW_VERSION=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace

      - name: Build release binaries
        run: cargo build --workspace --release

      - name: Check the agent's embedded version
        shell: pwsh
        run: |
          $want = "FLEETVIEW_AGENT_VERSION=${env:FLEETVIEW_VERSION}"
          $bytes = [System.IO.File]::ReadAllBytes("target\release\fleetview-agent.exe")
          $text = [System.Text.Encoding]::ASCII.GetString($bytes)
          if (-not $text.Contains($want)) { Write-Error "agent exe lacks $want"; exit 1 }

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test master
        working-directory: master
        env:
          FLEETVIEW_AGENT_BIN: ${{ github.workspace }}\target\release\fleetview-agent.exe
        run: |
          npm test
          npm run test:e2e

      # The agent needs no installer: the exe installs and updates itself.
      # The master is a Node app: ship its folder (no data, no .env).
      - name: Stage release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\fleetview-agent.exe "dist\FleetViewAgent-${env:FLEETVIEW_VERSION}.exe"
          Compress-Archive -Path master\server.js, master\package.json, master\.env.example, master\src, master\public, master\scripts, master\deploy `
            -DestinationPath "dist\FleetViewMaster-${env:FLEETVIEW_VERSION}.zip"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: FleetView ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            dist/FleetViewAgent-*.exe
            dist/FleetViewMaster-*.zip
