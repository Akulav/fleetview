name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # One version for everything: `version` in the workspace Cargo.toml. The
      # tag must match it, so the agent the master compiles, the master's update
      # check and the release name can never disagree.
      - name: Check tag matches Cargo.toml version
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($tag -ne $cargo) {
            Write-Error "Tag v$tag does not match Cargo.toml version $cargo. Bump [workspace.package] version first."
            exit 1
          }
          "version=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          echo "FLEETVIEW_VERSION=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace

      # Only for the end-to-end test. The agent is not published: the master
      # compiles it on demand, with its own web address built in.
      - name: Build the agent for the tests
        run: cargo build --workspace

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test master
        working-directory: master
        env:
          FLEETVIEW_AGENT_BIN: ${{ github.workspace }}\target\debug\fleetview-agent.exe
        run: |
          npm test
          npm run test:e2e

      # The master with the agent's sources, which it compiles itself
      # (no data, no .env, no prebuilt agent).
      - name: Stage release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path package.json, Cargo.toml, Cargo.lock, LICENSE, master, agent, shared, installer `
            -DestinationPath "dist\FleetView-${env:FLEETVIEW_VERSION}.zip"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: FleetView ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            dist/FleetView-*.zip
