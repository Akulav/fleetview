name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      # A check only (nothing is published): the master compiles the agent.
      - name: Build agent
        run: cargo build --workspace

      - name: Test agent
        run: cargo test --workspace

      - name: Test master (unit)
        working-directory: master
        run: npm test

      # The real agent against the real master: push installers, check results.
      - name: Test master + agent (end-to-end)
        working-directory: master
        env:
          FLEETVIEW_AGENT_BIN: ${{ github.workspace }}\target\debug\fleetview-agent.exe
        run: npm run test:e2e
