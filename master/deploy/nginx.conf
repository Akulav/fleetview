# nginx in front of the FleetView console (certificates e.g. from certbot).
# Agents do NOT go through here — they connect straight to TCP 48620.
server {
    listen 443 ssl http2;
    server_name fleetview.akulav.com;

    ssl_certificate     /etc/letsencrypt/live/fleetview.akulav.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fleetview.akulav.com/privkey.pem;

    client_max_body_size 2g;          # installer uploads
    proxy_request_buffering off;      # stream them to the master

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;          # server-sent events (live updates)
        proxy_read_timeout 1h;
    }
}

server {
    listen 80;
    server_name fleetview.akulav.com;
    return 301 https://$host$request_uri;
}
