[package]
name = "fleetview-agent"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
description = "FleetView agent — Windows service + tray helper. Made by Akulav."

[[bin]]
name = "fleetview-agent"
path = "src/main.rs"

[dependencies]
fleetview-shared = { path = "../shared" }
anyhow = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures-util = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_bytes = { workspace = true }
rmp-serde = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
chrono = { workspace = true }
sysinfo = { workspace = true }
image = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }

windows-service = "0.7"
winreg = "0.52"
tray-icon = "0.19"
xcap = "0.0.14"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
# Tiny blocking HTTP/1.1 server for the loopback MoldSign sign-bridge. Chosen
# over hyper to keep the surface and the dependency tree small: the bridge needs
# only to accept a handful of localhost requests, and tiny_http does exactly that
# with no async machinery of its own (we drive reqwest on a private runtime).
tiny_http = "0.12"
# The master's web address (wss://…/agent): WebSocket handshake only; TLS is
# done with the rustls above, against the public roots below.
tokio-tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
webpki-roots = "1"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Environment",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemServices",
    "Win32_System_StationsAndDesktops",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
]

[build-dependencies]
winresource = "0.1"
